<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accepted small print</title>
<!-- False positive once accepted: the project config states that the 12px small print is a decision. -->
<style>
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
main { padding: 24px; }
input[type="text"], input[type="email"] { display: block; width: 100%; box-sizing: border-box; height: 48px; font-size: 16px; }
button { min-height: 48px; padding: 0 24px; font-size: 16px; }
.fine-print { font-size: 12px; color: #444; }
</style>
</head>
<body>
<main>
  <h1>Plans</h1>
  <p>Every plan includes unlimited courses and email support.</p>
  <p class="fine-print">Prices exclude local taxes where they apply.</p>
</main>
</body>
