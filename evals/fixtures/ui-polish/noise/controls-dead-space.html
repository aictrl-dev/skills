<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Positive control: forced full-height form</title>
<!-- Must still fire: min-height: 100vh with justify-content: space-between pushes the button to the
     bottom and leaves a genuinely empty band above it. -->
<style>
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
main { padding: 24px; }
form { min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
input { display: block; width: 100%; box-sizing: border-box; height: 48px; font-size: 16px; }
button { min-height: 48px; width: 100%; font-size: 16px; }
</style>
</head>
<body>
<main>
  <form>
    <div>
      <h1>Your email</h1>
      <label for="email">Email</label>
      <input id="email" type="email" name="email">
    </div>
    <button type="submit">Next</button>
  </form>
</main>
</body>
</html>
