<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyebrow labels</title>
<!-- False positive: short uppercase letter-spaced labels above headings are small by design (reported as info). -->
<style>
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
main { padding: 24px; }
input[type="text"], input[type="email"] { display: block; width: 100%; box-sizing: border-box; height: 48px; font-size: 16px; }
button { min-height: 48px; padding: 0 24px; font-size: 16px; }
.eyebrow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #7a3410; margin: 0 0 8px; }
.step { font-size: 12px; letter-spacing: 0.1em; color: #444; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Case study</p>
  <h1>How a small team shared what it knows</h1>
  <p>Three people turned their onboarding notes into a short course in an afternoon.</p>
  <section>
    <p class="eyebrow">What they did</p>
    <h2><span class="step">01</span> Gathered the notes</h2>
    <p>Everything the team already wrote down went into one place first.</p>
  </section>
</main>
</body>
</html>
