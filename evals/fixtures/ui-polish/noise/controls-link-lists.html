<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Positive control: rows of links</title>
<!-- Must still fire: a pager and a sort row are lists of links, not links in a sentence. -->
<style>
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
main { padding: 24px; }
</style>
</head>
<body>
<main>
  <h1>Results</h1>
  <div id="pager">Page <a href="#p1">1</a> <a href="#p2">2</a> <a href="#p3">3</a></div>
  <div id="sort">Sort by: <a href="#price">Price</a> <a href="#name">Name</a></div>
</main>
</body>
</html>
