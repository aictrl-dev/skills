<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inline links in a sentence</title>
<!-- False positive: links inside a sentence are inline targets (WCAG 2.5.8 exception), even outside p or li. -->
<style>
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
main { padding: 24px; }
input[type="text"], input[type="email"] { display: block; width: 100%; box-sizing: border-box; height: 48px; font-size: 16px; }
button { min-height: 48px; padding: 0 24px; font-size: 16px; }
.consent { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.consent input { width: 20px; height: 20px; margin: 0; flex-shrink: 0; }
.note { display: block; margin: 16px 0; }
</style>
</head>
<body>
<main>
  <h1>Create your account</h1>
  <form>
    <label for="email">Email</label>
    <input id="email" type="email" name="email">
    <label class="consent"><input type="checkbox" name="terms" value="yes"><span>I agree to the <a href="#terms">terms of service</a> and the <a href="#privacy">privacy notice</a>.</span></label>
    <span class="note">Questions? <em><a href="#help">Contact support</a></em> at any time.</span>
    <button type="submit">Create account</button>
  </form>
</main>
</body>
</html>
