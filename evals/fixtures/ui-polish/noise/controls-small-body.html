<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Positive control: small body text</title>
<!-- Must still fire: a paragraph of running body text at 13px is a text-size warning, not an eyebrow. -->
<style>
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
main { padding: 24px; }
input[type="text"], input[type="email"] { display: block; width: 100%; box-sizing: border-box; height: 48px; font-size: 16px; }
button { min-height: 48px; padding: 0 24px; font-size: 16px; }
.body-small { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>About the course</h1>
  <p class="body-small">This course walks new starters through the first week, from setting up their laptop to meeting the people they will work with most, and ends with a short quiz.</p>
</main>
</body>
</html>
