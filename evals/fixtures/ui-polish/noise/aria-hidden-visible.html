<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visible aria-hidden content</title>
<!-- Positive control: aria-hidden hides content from screen readers, not from the eye. Visible faint
     small text and a visible 20px button inside aria-hidden must still be measured. -->
<style>
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
main { padding: 24px; }
.faint { font-size: 12px; color: #ccc; }
.tiny { width: 20px; height: 20px; padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Pricing</h1>
  <p aria-hidden="true" class="faint">Decorative caption that is still on screen</p>
  <div aria-hidden="true"><button class="tiny" type="button">x</button></div>
</main>
</body>
</html>
