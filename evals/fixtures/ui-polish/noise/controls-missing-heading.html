<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Positive control: no heading</title>
<!-- Must still fire: #bare has no heading anywhere before it; #far has one, but more than a screen above. -->
<style>
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
main { padding: 24px; }
input[type="text"], input[type="email"] { display: block; width: 100%; box-sizing: border-box; height: 48px; font-size: 16px; }
button { min-height: 48px; padding: 0 24px; font-size: 16px; }
.spacer { height: 1400px; }
</style>
</head>
<body>
<main>
  <form id="bare">
    <label for="bare-email">Email</label>
    <input id="bare-email" type="email" name="email">
    <button type="submit">Continue</button>
  </form>
  <div class="spacer"></div>
  <h2>Archive</h2>
  <div class="spacer"></div>
  <form id="far">
    <label for="far-name">Name</label>
    <input id="far-name" type="text" name="name">
    <button type="submit">Save</button>
  </form>
</main>
</body>
</html>
