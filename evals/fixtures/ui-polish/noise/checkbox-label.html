<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkbox in a label row</title>
<!-- False positive: a 20px checkbox in a 44px label that wraps it, and a 20px radio whose 44px label[for]
     touches it. The label is the target. -->
<style>
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
main { padding: 24px; }
input[type="text"], input[type="email"] { display: block; width: 100%; box-sizing: border-box; height: 48px; font-size: 16px; }
button { min-height: 48px; padding: 0 24px; font-size: 16px; }
.option { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.option input { width: 20px; height: 20px; margin: 0; }
.row { display: flex; align-items: center; }
.row label { padding-left: 8px; } /* the label touches the radio: its box is the target */
.row input { width: 20px; height: 20px; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Pick your topics</h1>
  <form>
    <fieldset>
      <legend>Topics</legend>
      <label class="option"><input type="checkbox" name="topic" value="onboarding"> Onboarding</label>
      <label class="option"><input type="checkbox" name="topic" value="safety"> Safety</label>
    </fieldset>
    <fieldset>
      <legend>How often</legend>
      <div class="row"><input type="radio" id="freq-weekly" name="freq" value="weekly"><label for="freq-weekly" class="option">Weekly</label></div>
      <div class="row"><input type="radio" id="freq-monthly" name="freq" value="monthly"><label for="freq-monthly" class="option">Monthly</label></div>
    </fieldset>
    <button type="submit">Save</button>
  </form>
</main>
</body>
</html>
