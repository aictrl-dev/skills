name: Validate public skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm ci --prefix tooling
      - name: Install browser for Mermaid render validation
        working-directory: tooling
        run: npx puppeteer browsers install chrome
      - name: Test public distribution contracts
        run: npm test --prefix tooling
      - name: Validate catalog, plugin metadata, portability, and secrets
        run: npm run validate --prefix tooling
      - name: Verify release checksums are current
        run: diff -u CHECKSUMS.sha256 <(./scripts/generate-checksums.sh)

  claude-clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm ci --prefix tooling
      - run: npm install --global @anthropic-ai/claude-code@2.1.210
      - name: Test Claude marketplace install, reinstall, and uninstall
        env:
          AICTRL_CLAUDE_MARKETPLACE_SOURCE: ${{ github.event.pull_request.head.repo.full_name || github.repository }}@${{ github.head_ref || github.ref_name }}
        run: npm run smoke:claude --prefix tooling

  codex-clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm ci --prefix tooling
      - run: npm install --global @openai/codex@0.144.4
      - name: Test Codex root marketplace install, upgrade, and uninstall
        run: npm run smoke:codex --prefix tooling

  production-mcp:
    name: Production MCP catalog contract
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm ci --prefix tooling
      - name: Verify authenticated catalog and organization boundary
        env:
          AICTRL_API_KEY: ${{ secrets.AICTRL_API_KEY }}
        run: npm run smoke:production-mcp --prefix tooling
